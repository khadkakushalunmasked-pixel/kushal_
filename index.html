<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
        let hasTyped = false; // Prevents the typing effect from running twice

        // 1. Dashboard Unlock
        function lockAndEnterDashboard() {
            document.getElementById('intro-container').style.display = 'none'; 
            document.documentElement.style.scrollSnapType = 'none';
            
            const dashboard = document.getElementById('main-dashboard');
            dashboard.style.display = 'block';
            dashboard.classList.add('visible');
            
            window.scrollTo(0, 0);
            AOS.init({ once: true, offset: 50 });

            // Start typing effect only after dashboard opens
            if (!hasTyped) {
                setTimeout(startTypingEffect, 500); // Half-second delay so it types while you look
                hasTyped = true;
            }
        }

        // 2. Typing Effect (Runs Once, Stops Cursor at the End)
        function startTypingEffect() {
            const textElement = document.querySelector(".typing-text");
            const cursorElement = document.querySelector(".cursor");
            
            if (textElement) {
                const text = "Kushal Khadka"; 
                let index = 0;
                textElement.textContent = ""; // Make sure it starts blank

                function type() {
                    textElement.textContent = text.slice(0, index);
                    index++;
                    
                    if (index <= text.length) {
                        setTimeout(type, 150); // Typing speed
                    } else {
                        // Stop the cursor from blinking when finished
                        if (cursorElement) {
                            cursorElement.style.animation = "none";
                            cursorElement.style.opacity = "1"; // Leaves the solid cursor at the end
                            // Tip: If you want the cursor to disappear entirely, change the line above to: cursorElement.style.display = "none";
                        }
                    }
                }
                
                type(); // Start typing
            }
        }

        // 3. Mobile Menu & Dropdown Logic
        function toggleMobileMenu() {
            document.getElementById("navLinks").classList.toggle("active");
        }
        function toggleDropdown() { 
            document.getElementById("myDropdown").classList.toggle("show"); 
        }
        
        window.onclick = function(e) { 
            if (!e.target.matches('.dropbtn') && !e.target.matches('.dropbtn *')) { 
                var d = document.getElementsByClassName("dropdown-content"); 
                for (var i=0; i<d.length; i++) { 
                    if (d[i].classList.contains('show')) d[i].classList.remove('show'); 
                }
            }
            if (!e.target.closest('nav')) {
                var nav = document.getElementById("navLinks");
                if(nav && nav.classList.contains('active')) nav.classList.remove("active");
            }
        }

        // 4. Slideshow Logic
        const coverImages = document.querySelectorAll('.cover-photo-container img');
        let slideIndex = 0;
        setInterval(() => {
            if (coverImages.length > 1) {
                coverImages[slideIndex].classList.remove('active');
                slideIndex = (slideIndex + 1) % coverImages.length;
                coverImages[slideIndex].classList.add('active');
            }
        }, 5000); 

        // 5. Dashboard Load via Hash
        window.addEventListener('load', function() {
            if(window.location.hash === "#dashboard") {
                lockAndEnterDashboard();
            }
        });

        // 6. Floating Chat Widget Logic
        function toggleChatWindow() {
            const chatWindow = document.getElementById('chatWidgetWindow');
            if (chatWindow) chatWindow.classList.toggle('show-chat');
        }
    </script>
